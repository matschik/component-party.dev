name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build application
        run: pnpm run build

      - name: Check static output
        run: test -s dist/_redirects && test -s dist/sitemap.xml && test -s dist/404.html

      - name: Run checks
        run: pnpm check:ci

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Check dependencies
        run: pnpm check:deps

      - name: Check toolchain entry points
        run: pnpm check:toolchain

      - name: Install Playwright Chromium
        run: pnpm run test:e2e:install

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Void builds dist/ and ships it to the `component-party` Worker
  # (void.config.ts). Only pushes to main deploy.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

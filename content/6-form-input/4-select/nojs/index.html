<div
  state="{
    selectedColorId: 2,
    colors: [
      { id: 1, text: 'red' },
      { id: 2, text: 'blue' },
      { id: 3, text: 'green' },
      { id: 4, text: 'gray', isDisabled: true }
    ]
  }"
>
  <select model="selectedColorId">
    <option
      each="color in colors"
      key="color.id"
      bind="color.text"
      bind-value="color.id"
      bind-disabled="!!color.isDisabled"
    ></option>
  </select>
</div>
